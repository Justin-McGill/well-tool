<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All-in-One Well Offset Tool</title>
<!-- ArcGIS Maps SDK for JavaScript Links -->
<link href="https://arcgis.com" rel="stylesheet">
<script src="https://arcgis.com"></script>
<script src="https://jsdelivr.net"></script>
<style>
body,html{padding:0;margin:0;height:100%;width:100%;font-family:sans-serif;display:flex}
#sidebar{width:320px;background:#fff;padding:20px;box-shadow:2px 0 5px rgb(0 0 0 / .1);box-sizing:border-box;overflow-y:auto;display:flex;flex-direction:column;height:100%}
#mapDiv{flex:1;height:100%}
label{font-weight:700;margin-top:15px;display:block;font-size:14px}
button,input,select{width:100%;padding:8px;margin-top:5px;box-sizing:border-box;border:1px solid #ccc;border-radius:4px;font-size:14px}
button{background:#0079c1;color:#fff;border:none;font-weight:700;cursor:pointer;margin-top:20px}
button:hover{background:#005e95}
#searchFilter{margin-bottom:5px;background-color:#fff}
#checkboxContainer{max-height:150px;overflow-y:auto;border:1px solid #ccc;border-radius:4px;padding:8px;background:#fafafa}
.checkbox-item{display:flex;align-items:center;margin-bottom:6px;font-size:13px}
.checkbox-item input{width:auto;margin:0 8px 0 0;cursor:pointer}
.checkbox-item label{font-weight:400;margin:0;cursor:pointer}
#resultsPanel{margin-top:20px;border-top:1px solid #eee;padding-top:15px;display:none}
.action-btn{background:#28a745;margin-top:10px}
.action-btn:hover{background:#218838}
.secondary-btn{background:#6c757d}
.secondary-btn:hover{background:#5a6268}
</style>
</head>
<body>
<div id="sidebar">
<h2>Well Offset Tool</h2>
<label for="layerSelect">1. Target Layer to Buffer</label>
<select id="layerSelect"><option value="">-- Select a Layer --</option></select>
<label>2. Select Feature(s)</label>
<input id="searchFilter" placeholder="Type to search/filter features..." disabled>
<div id="checkboxContainer">
<div style="color:#888;font-size:13px;text-align:center;padding-top:10px">Select a layer first...</div>
</div>
<label for="bufferDistance">3. Buffer Distance (US Feet)</label>
<input id="bufferDistance" placeholder="Enter distance (e.g. 1320)" min="1" type="number">
<button id="runBtn">Run Analysis</button>
<div id="resultsPanel">
<h3>Analysis Results</h3>
<div id="statusText">Found 0 wells.</div>
<button id="exportExcel" class="action-btn">Export Table to Excel</button>
<button id="exportPdf" class="secondary-btn">Print Map View (PDF)</button>
</div>
</div>
<div id="mapDiv"></div>

<script>
require([
  "esri/config",
  "esri/identity/IdentityManager",
  "esri/Map",
  "esri/views/MapView",
  "esri/layers/FeatureLayer",
  "esri/geometry/geometryEngine",
  "esri/rest/support/Query",
  "esri/widgets/Print"
], function(esriConfig, IdentityManager, Map, MapView, FeatureLayer, geometryEngine, Query, Print) {

  // CRITICAL STEP 1: Change this URL to match your exact internal Enterprise Portal home address 
  // (e.g., https://mycompany.com)
  esriConfig.portalUrl = "https://ulmegis.utsystem.edu/portal/"; 

  // CRITICAL STEP 2: Inherit login session tokens from the parent Experience Builder application window [1]
  if (window.parent) {
    try {
      const parentIdManager = window.parent.require("esri/identity/IdentityManager");
      if (parentIdManager) {
        IdentityManager.initialize(parentIdManager.toJSON());
      }
    } catch (e) {
      console.log("Could not pull token from parent Experience Builder window. Running in sandbox.", e);
    }
  }

  // CONFIGURATION: Replace these placeholders with your actual secure Portal REST endpoints [1]
  const sourceLayersConfig = [
      { title: "Lease", url: "https://ulmegis.utsystem.edu/server/rest/services/Hosted/OG_Lease/FeatureServer" }
    ];
      { title: "Mineral Contract", url: "https://ulmegis.utsystem.edu/server/rest/services/Hosted/MN_UnitAgreement/FeatureServer" }
    ];
      { title: "Well", url: "https://ulmegis.utsystem.edu/server/rest/services/Hosted/WellCompletion/FeatureServer" }
    ];

    const wellLayersConfig = [
      { title: "UL Wells", url: "https://ulmegis.utsystem.edu/server/rest/services/Hosted/WellCompletion/FeatureServer" },
      { title: "MDM Wells", url: "https://ulmegis.utsystem.edu/server/rest/services/WellCompletion_MDM/FeatureServer" }
    ];

  // Initialize the rest of the application mapping engine
  const map = new Map({ basemap: "topo-vector" });
  const view = new MapView({ container: "mapDiv", map: map, center: [-98.5, 39.8], zoom: 4 });
  let loadedSourceLayers = []; let loadedWellLayers = []; let calculatedWellsData = [];

  sourceLayersConfig.forEach(cfg => {
    let layer = new FeatureLayer({ url: cfg.url, title: cfg.title, outFields: ["*"] });
    map.add(layer); loadedSourceLayers.push(layer);
    let opt = document.createElement("option"); opt.value = cfg.title; opt.textContent = cfg.title;
    document.getElementById("layerSelect").appendChild(opt);
  });

  wellLayersConfig.forEach(cfg => {
    let layer = new FeatureLayer({ url: cfg.url, title: cfg.title, outFields: ["*"] });
    map.add(layer); loadedWellLayers.push(layer);
  });

  document.getElementById("layerSelect").addEventListener("change", async (e) => {
    const container = document.getElementById("checkboxContainer"); const searchInput = document.getElementById("searchFilter");
    container.innerHTML = ""; searchInput.value = "";
    const selectedLayer = loadedSourceLayers.find(l => l.title === e.target.value);
    if (!selectedLayer) { container.innerHTML = '<div style="color: #888; font-size: 13px; text-align: center; padding-top: 10px;">Select a layer first...</div>'; searchInput.disabled = true; return; }
    
    const query = selectedLayer.createQuery(); query.where = "1=1"; query.outFields = ["OBJECTID", "NAME"]; query.returnGeometry = false;
    const results = await selectedLayer.queryFeatures(query);
    if (results.features.length === 0) { container.innerHTML = '<div style="color: #888; font-size: 13px; text-align: center;">No features found.</div>'; searchInput.disabled = true; return; }
    
    searchInput.disabled = false;
    results.features.forEach(f => {
      const oid = f.attributes.OBJECTID; const displayName = f.attributes.NAME || `ID:${oid}`;
      let wrapper = document.createElement("div"); wrapper.className = "checkbox-item"; wrapper.setAttribute("data-name", displayName.toLowerCase());
      let checkbox = document.createElement("input"); checkbox.type = "checkbox"; checkbox.value = oid; checkbox.id = "chk_" + oid; checkbox.className = "record-checkbox";
      let label = document.createElement("label"); label.setAttribute("for", "chk_" + oid); label.textContent = displayName;
      wrapper.appendChild(checkbox); wrapper.appendChild(label); container.appendChild(wrapper);
    });
  });

  document.getElementById("searchFilter").addEventListener("input", (e) => {
    const searchText = e.target.value.toLowerCase(); const items = document.querySelectorAll(".checkbox-item");
    items.forEach(item => {
      const name = item.getAttribute("data-name");
      if (name.includes(searchText)) { item.style.display = "flex"; } else { item.style.display = "none"; }
    });
  });

  document.getElementById("runBtn").addEventListener("click", async () => {
    const layerTitle = document.getElementById("layerSelect").value; const distanceStr = document.getElementById("bufferDistance").value;
    const checkedBoxes = document.querySelectorAll(".record-checkbox:checked"); const selectedIds = Array.from(checkedBoxes).map(cb => parseInt(cb.value));
    if (!layerTitle || selectedIds.length === 0 || !distanceStr) { alert("Error: All fields are required."); return; }
    
    const distance = parseFloat(distanceStr); const targetLayer = loadedSourceLayers.find(l => l.title === layerTitle);
    const geoQuery = targetLayer.createQuery(); geoQuery.objectIds = selectedIds; geoQuery.returnGeometry = true;
    const geoResults = await targetLayer.queryFeatures(geoQuery); const geometries = geoResults.features.map(f => f.geometry);
    const mergedGeometry = geometryEngine.union(geometries); const bufferGeometry = geometryEngine.buffer(mergedGeometry, distance, "feet");
    const oldLayer = map.findLayerById("wells_by_formation_layer"); if (oldLayer) map.remove(oldLayer);
    
    let mergedWellFeatures = [];
    for (let wellLayer of loadedWellLayers) {
      let wellQuery = wellLayer.createQuery(); wellQuery.geometry = bufferGeometry; wellQuery.spatialRelationship = "disjoint"; wellQuery.outFields = ["*"]; wellQuery.returnGeometry = true;
      let wellResults = await wellLayer.queryFeatures(wellQuery); mergedWellFeatures.push(...wellResults.features);
    }
    
    calculatedWellsData = mergedWellFeatures;
    document.getElementById("statusText").textContent = `Found ${mergedWellFeatures.length} wells outside the buffer.`;
    document.getElementById("resultsPanel").style.display = "block";
    if (mergedWellFeatures.length === 0) return;
    
    let idCounter = 1;
    const processedFeatures = mergedWellFeatures.map(f => { let newFeat = f.clone(); newFeat.attributes.CUSTOM_OID = idCounter++; return newFeat; });
    const derivativeLayer = new FeatureLayer({
      id: "wells_by_formation_layer", title: "Wells by Formation", source: processedFeatures, objectIdField: "CUSTOM_OID",
      fields: [{ name: "CUSTOM_OID", type: "oid" }, { name: "Formation", type: "string" }, { name: "NAME", type: "string" }],
      renderer: { type: "unique-value", field: "Formation", defaultSymbol: { type: "simple-marker", color: "gray", size: "8px" } }
    });
    map.add(derivativeLayer); view.goTo(bufferGeometry);
  });

  document.getElementById("exportExcel").addEventListener("click", () => {
    if (calculatedWellsData.length === 0) return;
    const rows = calculatedWellsData.map(f => f.attributes); const worksheet = XLSX.utils.json_to_sheet(rows);
    const workbook = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(workbook, worksheet, "Wells");
    XLSX.writeFile(workbook, "Well_Offset_Data.xlsx");
  });

const printWidget = new Print({ view: view, printServiceUrl: "arcgisonline.com" });document.getElementById("exportPdf").addEventListener("click", () => { printWidget.print(); });});
